<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Miless — Shikimori(разработка)</title>
  <link rel="stylesheet" href="style.css" />
  <link rel="stylesheet" href="shikimori.css" />
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css" />
</head>
<body>
  <div class="stars" aria-hidden="true"></div>
  <div class="twinkling" aria-hidden="true"></div>

  <div class="container shikimori-page">
    <div class="glow-ring"></div>

    <!-- Навигация назад -->
    <nav class="top-nav">
      <a href="index.html" class="back-btn">
        <i class="fas fa-arrow-left"></i> На главную
      </a>
    </nav>

    <!-- Заголовок -->
    <div class="page-header">
      <h1><i class="fas fa-anchor"></i> Shikimori профиль</h1>
      <p class="subtitle">Твой аниме-лист в одном месте</p>
    </div>

    <!-- Статистика -->
    <div class="stats-grid" id="statsGrid">
      <div class="stat-card">
        <div class="stat-number" id="totalAnime">0</div>
        <div class="stat-label">Всего аниме</div>
      </div>
      <div class="stat-card">
        <div class="stat-number" id="completedAnime">0</div>
        <div class="stat-label">Просмотрено</div>
      </div>
      <div class="stat-card">
        <div class="stat-number" id="watchingAnime">0</div>
        <div class="stat-label">Смотрю</div>
      </div>
      <div class="stat-card">
        <div class="stat-number" id="plannedAnime">0</div>
        <div class="stat-label">В планах</div>
      </div>
      <div class="stat-card">
        <div class="stat-number" id="avgScore">0</div>
        <div class="stat-label">Средняя оценка</div>
      </div>
      <div class="stat-card">
        <div class="stat-number" id="totalEpisodes">0</div>
        <div class="stat-label">Всего серий</div>
      </div>
    </div>

    <!-- Фильтры и сортировка -->
    <div class="controls">
      <div class="filter-group">
        <button class="filter-btn active" data-status="all">Все</button>
        <button class="filter-btn" data-status="watching">⏳ Смотрю</button>
        <button class="filter-btn" data-status="completed">✅ Просмотрено</button>
        <button class="filter-btn" data-status="planned">📅 В планах</button>
        <button class="filter-btn" data-status="on_hold">⏸ Отложено</button>
        <button class="filter-btn" data-status="dropped">❌ Брошено</button>
      </div>
      <div class="sort-group">
        <label>Сортировка:</label>
        <select id="sortSelect">
          <option value="score-desc">По оценке ↓</option>
          <option value="score-asc">По оценке ↑</option>
          <option value="name-asc">По названию А-Я</option>
          <option value="name-desc">По названию Я-А</option>
          <option value="date-desc">Сначала новые</option>
          <option value="date-asc">Сначала старые</option>
        </select>
      </div>
      <div class="search-group">
        <input type="text" id="searchInput" placeholder="🔍 Поиск по названию..." />
      </div>
    </div>

    <!-- Список аниме -->
    <div id="animeListContainer">
      <div class="loading-spinner">⏳ Загрузка аниме...</div>
      <div id="animeGrid" class="anime-grid">
        <!-- Тут будут карточки -->
      </div>
      <div id="loadMoreContainer" style="display: none; text-align: center; margin-top: 2rem;">
        <button id="loadMoreBtn" class="extra-btn">Загрузить ещё</button>
      </div>
    </div>

    <!-- Случайное аниме -->
    <div class="random-section">
      <h2><i class="fas fa-dice"></i> Случайное аниме дня</h2>
      <div id="randomAnime">
        <div class="loading-spinner">⏳ Загрузка...</div>
      </div>
    </div>

    <!-- Топ-5 по оценкам -->
    <div class="top-section">
      <h2><i class="fas fa-trophy"></i> Топ-5 по твоим оценкам</h2>
      <div id="topAnime">
        <div class="loading-spinner">⏳ Загрузка...</div>
      </div>
    </div>

    <footer>
      <p>🌙 Miless • 2026 • Сделано с ❤️ для сообщества Shikimori</p>
    </footer>
  </div>

  <script src="shikimori.js"></script>
</body>
</html>
