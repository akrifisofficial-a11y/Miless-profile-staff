<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Мои любимые аниме</title>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
</head>
<body>
    <div class="container">
        <header class="profile">
            <img src="https://i.pravatar.cc/150?img=11" alt="Аватар" class="avatar">
            <h1>Мои любимые аниме</h1>
            <p class="bio">✨ Автоматически из моего списка Shikimori</p>
        </header>

        <section class="links">
            <a href="https://anixart-app.com/profile/4077379" target="_blank" class="link-card anixart">
                <i class="fas fa-play"></i> Anixart
            </a>
            <a href="https://vk.ru/akrifisofficial" target="_blank" class="link-card vk">
                <i class="fab fa-vk"></i> VK
            </a>
            <a href="https://discord.com/users/1438577441231863842" target="_blank" class="link-card discord">
                <i class="fab fa-discord"></i> Discord
            </a>
        </section>

        <section class="anime-section">
            <h2>❤️ Мои любимые аниме</h2>
            <div class="anime-grid" id="animeGrid"></div>
        </section>
    </div>

    <!-- Модальное окно для плеера -->
    <div id="playerModal" class="modal">
        <div class="modal-content">
            <span class="close-btn" id="closeModal">&times;</span>
            <h3 id="modalTitle">Название аниме</h3>
            <div id="playerContainer">
                <p id="loadingMsg">Загрузка видео...</p>
            </div>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
